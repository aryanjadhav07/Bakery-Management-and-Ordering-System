services:
  - type: web
    name: bakery-backend
    env: python
    buildCommand: |
      pip install -r requirements.txt
    startCommand: |
      python manage.py migrate && python manage.py collectstatic --noinput && gunicorn bakery_platform.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9